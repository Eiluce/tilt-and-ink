<svg xmlns="http://www.w3.org/2000/svg" width="280" height="40" viewBox="0 0 280 40">
  <!-- left solar panel -->
  <rect x="15" y="10" width="95" height="20" fill="#1f3a5f" stroke="#201a14" stroke-width="4" />
  <line x1="30" y1="10" x2="30" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="45" y1="10" x2="45" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="60" y1="10" x2="60" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="75" y1="10" x2="75" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="90" y1="10" x2="90" y2="30" stroke="#3a5a86" stroke-width="2" />

  <!-- right solar panel -->
  <rect x="170" y="10" width="95" height="20" fill="#1f3a5f" stroke="#201a14" stroke-width="4" />
  <line x1="185" y1="10" x2="185" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="200" y1="10" x2="200" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="215" y1="10" x2="215" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="230" y1="10" x2="230" y2="30" stroke="#3a5a86" stroke-width="2" />
  <line x1="245" y1="10" x2="245" y2="30" stroke="#3a5a86" stroke-width="2" />

  <!-- satellite body / hub -->
  <rect x="122" y="6" width="36" height="28" rx="5" fill="#8b93a3" stroke="#201a14" stroke-width="4" />
  <circle cx="140" cy="20" r="4" fill="#6fd6e0" stroke="#201a14" stroke-width="1.5" />
</svg>
