<svg xmlns="http://www.w3.org/2000/svg" width="400" height="700" viewBox="0 0 400 700">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1330" />
      <stop offset="55%" stop-color="#12101f" />
      <stop offset="100%" stop-color="#05040a" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#7a3fae" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7a3fae" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgVignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <rect width="400" height="700" fill="url(#bgBase)" />
  <ellipse cx="200" cy="130" rx="260" ry="220" fill="url(#bgGlow)" />

  <!-- faint warp-speed streaks radiating from above the table -->
  <g opacity="0.05" stroke="#bfe9f0" stroke-width="10">
    <line x1="200" y1="-120" x2="20" y2="700" />
    <line x1="200" y1="-120" x2="90" y2="700" />
    <line x1="200" y1="-120" x2="160" y2="700" />
    <line x1="200" y1="-120" x2="240" y2="700" />
    <line x1="200" y1="-120" x2="310" y2="700" />
    <line x1="200" y1="-120" x2="380" y2="700" />
  </g>

  <!-- scattered stars -->
  <g fill="#f4f4f8">
    <circle cx="30" cy="80" r="1.5" opacity="0.9" />
    <circle cx="70" cy="40" r="2" opacity="0.7" />
    <circle cx="120" cy="150" r="1.8" opacity="0.8" />
    <circle cx="350" cy="60" r="2.2" opacity="0.9" />
    <circle cx="300" cy="200" r="1.5" opacity="0.6" />
    <circle cx="20" cy="300" r="2" opacity="0.8" />
    <circle cx="380" cy="350" r="1.8" opacity="0.7" />
    <circle cx="50" cy="450" r="1.5" opacity="0.9" />
    <circle cx="150" cy="500" r="2" opacity="0.6" />
    <circle cx="250" cy="480" r="1.6" opacity="0.8" />
    <circle cx="330" cy="550" r="2.2" opacity="0.7" />
    <circle cx="60" cy="600" r="1.5" opacity="0.9" />
    <circle cx="200" cy="620" r="1.8" opacity="0.6" />
    <circle cx="100" cy="250" r="1.4" opacity="0.8" />
    <circle cx="280" cy="120" r="1.6" opacity="0.9" />
    <circle cx="370" cy="480" r="1.5" opacity="0.7" />
    <circle cx="15" cy="180" r="1.7" opacity="0.8" />
    <circle cx="180" cy="80" r="1.3" opacity="0.9" />
    <circle cx="320" cy="320" r="1.9" opacity="0.6" />
    <circle cx="90" cy="380" r="1.5" opacity="0.8" />
  </g>

  <rect width="400" height="700" fill="url(#bgVignette)" />
</svg>
